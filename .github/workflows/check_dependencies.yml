name: Check Dependencies Pipeline

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  check-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup ARES Environment
        uses: ./.github/workflow-actions/setup-ares

      - name: Verify uv.lock is unchanged
        shell: bash
        run: |
          if ! git diff --quiet -- uv.lock || test -n "$(git ls-files --others --exclude-standard -- uv.lock)"; then
            echo "::error title=uv.lock check::uv sync changed uv.lock. Commit the updated lockfile."
            echo "::group::uv.lock changes"
            git status --short -- uv.lock
            git diff -- uv.lock
            echo "::endgroup::"
            exit 1
          fi
          echo "::notice title=uv.lock check::uv.lock is unchanged."

      - name: Run dependency analysis and generate NOTICE
        run: |
          make thirdpartycheck

      - name: Compare generated NOTICE with remote master
        run: |
          # Ensure local copy of origin/master is up to date
          git fetch origin master

          # Compare the freshly generated file on disk with the blob from origin/master
          # Using --no-index to compare a process substitution stream with a physical file
          if git diff --no-index --exit-code <(git show origin/master:NOTICE) NOTICE > /dev/null 2>&1; then
            echo "::notice title=NOTICE check::The generated NOTICE matches origin/master."
          else
            echo "::error title=NOTICE check::The generated NOTICE differs from origin/master."
            echo "::group::NOTICE differences"

            # Display the actual diff for debugging purposes
            git diff --no-index <(git show origin/master:NOTICE) NOTICE

            echo "::endgroup::"
            # Fail the build
            exit 1
          fi

      - name: Cleanup ARES Environment
        uses: ./.github/workflow-actions/cleanup-ares
