name: Check Dependencies Pipeline

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  check-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup ARES Environment
        uses: ./.github/workflow-actions/setup-ares

      - name: Verify uv.lock is unchanged
        shell: bash
        run: |
          if ! git diff --quiet -- uv.lock || test -n "$(git ls-files --others --exclude-standard -- uv.lock)"; then
            echo "::error title=uv.lock check::uv sync changed uv.lock. Commit the updated lockfile."
            echo "::group::uv.lock changes"
            git status --short -- uv.lock
            git diff -- uv.lock
            echo "::endgroup::"
            exit 1
          fi
          echo "::notice title=uv.lock check::uv.lock is unchanged."

      - name: Run dependency analysis and generate NOTICE
        run: |
          make thirdpartycheck

      - name: Verify NOTICE is unchanged
        run: |
          if ! git diff --quiet -- NOTICE || test -n "$(git ls-files --others --exclude-standard -- NOTICE)"; then
            echo "::error title=NOTICE check::make thirdpartycheck changed NOTICE. Commit the updated NOTICE."
            echo "::group::NOTICE changes"
            git status --short -- NOTICE
            git diff -- NOTICE
            echo "::endgroup::"
            exit 1
          fi
          echo "::notice title=NOTICE check::NOTICE is unchanged."

      - name: Cleanup ARES Environment
        uses: ./.github/workflow-actions/cleanup-ares
