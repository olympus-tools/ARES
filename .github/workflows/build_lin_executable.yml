name: Build Linux Executable Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-lin-executable:
    strategy:
      matrix:
        include:
          - python-version: '3.13.7'
            runner: ubuntu-24.04
          - python-version: '3.14'
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup ARES Environment
        uses: ./.github/workflow-actions/setup-ares
        with:
          python-version: ${{ matrix.python-version }}
          locked: true

      - name: Build executable
        run: |
          make build-executable

      - name: Verify executable
        run: |
          ./dist/ares --version

      - name: Build simulation units
        run: |
          make -C examples/sim_unit all

      - name: Run all workflow examples with Executable
        run: |
          make -C examples ARES=../dist/ares

      - name: Upload Linux executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ares-linux-executable-py${{ matrix.python-version }}
          path: dist/ares
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup ARES Environment
        uses: ./.github/workflow-actions/cleanup-ares
