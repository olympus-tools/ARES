name: Build Windows Executable Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-win-executable:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version:
          - '3.13.7'
          - '3.14'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup ARES Environment
        uses: ./.github/workflow-actions/setup-ares
        with:
          python-version: ${{ matrix.python-version }}
          locked: true

      - name: Build executable
        shell: bash
        run: |
          make build-executable

      - name: Verify executable
        shell: bash
        run: |
          ./dist/ares.exe --version

      - name: Build simulation units
        shell: bash
        run: |
          make -C examples/sim_unit all

      - name: Run all workflow examples with Executable
        shell: bash
        run: |
          make -C examples ARES=../dist/ares.exe

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ares-windows-executable-py${{ matrix.python-version }}
          path: dist/ares.exe
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup ARES Environment
        uses: ./.github/workflow-actions/cleanup-ares
