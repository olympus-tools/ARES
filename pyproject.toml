[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ares"
version = "0.1.0"
description = "automated rapid embedded simulation"
readme = "README.md"
authors = [
  {name = "Andrä Carotta"},
  {name = "Jonas Bleich"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13.7,<3.15"
keywords = ["embedded", "simulation", "automotive", "sil", "ares"]
classifiers = [
    # Intended Audience
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",

    # Topic
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Emulators",

    # Programming Language
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",

    # Operating System
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",

    # Environment
    "Environment :: Console",
]

dependencies = [
    "numpy>=2.5.5",
    "numba>=0.68.1",
    "scipy>=1.18.1",
    "asammdf>=8.8.33",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.4",
    "typeguard>=4.4.0",
    "click>=8.5.1",
    "colorlog>=6.12.0",
    "dcmi",
    "rich>=15.0.0",
]
[project.scripts]
ares = "ares.cli.ares:cli"

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
dev = [
    "ruff>=0.17.6",
    "build>=1.6.1",
    "twine>=7.0.0",
    "gitpython>=3.2.1",
    "pip-licenses>=5.5.5",
    "pipdeptree>=4.2.15",
    "pyinstaller>=6.22.3",
    "matplotlib>=3.11.2",
    "ares[test]",
]
docs = [
    "sphinx>=9.2.0",
    "furo>=2025.12.19",
    "myst-parser>=5.2.0",
    "sphinx-autodoc-typehints>=3.17.6",
    "sphinxcontrib-mermaid>=2.1.1",
]
release = [
    "ares[dev]",
    "ares[docs]",
]

debug = [
    "debugpy>=1.8.22",
]

[tool.uv.sources]
dcmi = { path = "submodules/dcmi", editable = true }

[project.urls]
"Homepage" = "https://github.com/olympus-tools/ARES"
"Documentation" = "https://github.com/olympus-tools/ARES#readme"
"Bug Tracker" = "https://github.com/olympus-tools/ARES/issues"
"Repository" = "https://github.com/olympus-tools/ARES"
"Changelog" = "https://github.com/olympus-tools/ARES/releases"
"Source" = "https://github.com/olympus-tools/ARES"
"Security Policy" = "https://github.com/olympus-tools/ARES/security/policy"
"Contributing" = "https://github.com/olympus-tools/ARES/blob/master/CONTRIBUTING.md"

[tool.setuptools.packages.find]
include = ["ares*"]

[tool.setuptools.package-data]
ares = [
    "py.typed",
    "plugins/sim_interface.c",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = [
    "--ignore=test/examples",
]

[tool.ruff]
# The maximum line length.
line-length = 88
# The target Python version.
target-version = "py313"
# Excluded files and directories.
exclude = [
    "ares/core/version.py",
    "packages",
    "submodules",
    ".venv",
]

[tool.ruff.format]
# The preferred quote style.
quote-style = "double"
# The preferred indentation style.
indent-style = "space"

[tool.pyright]
# Pyright will analyze files in this directory.
include = ["ares", "submodules", "test"]

[tool.uv]
python-preference = "system"
python-downloads = "manual"
